name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo (transfer engine)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: libs/transfer -> libs/transfer/target
          shared-key: ci-transfer-${{ matrix.os }}
          cache-targets: false

      - name: Cache cargo (native UI)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: chrome -> chrome/target
          shared-key: ci-chrome-${{ matrix.os }}
          cache-targets: false

      - name: Test (Go)
        run: go test ./...

      - name: Test (transfer engine)
        run: cargo test --manifest-path libs/transfer/Cargo.toml --workspace

      - name: Test (native UI)
        run: cargo test --manifest-path chrome/Cargo.toml --bins

      - name: Build host
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            # Match release: GUI subsystem, no console on double-click.
            go build -ldflags "-H windowsgui -s -w" -o suzuri.exe ./cmd/suzuri
          else
            go build -o suzuri ./cmd/suzuri
          fi

      - name: Build transfer engine
        shell: bash
        run: |
          cargo build --release --manifest-path libs/transfer/Cargo.toml -p hato-cli
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            test -f libs/transfer/target/release/suzuri-transfer.exe
          else
            test -f libs/transfer/target/release/suzuri-transfer
          fi

      - name: Build native UI
        shell: bash
        run: |
          cargo build --release --manifest-path chrome/Cargo.toml --bin suzuri-chrome
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            test -f chrome/target/release/suzuri-chrome.exe
          else
            test -f chrome/target/release/suzuri-chrome
          fi
