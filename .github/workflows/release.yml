name: Release

# Cut a release: git tag v0.6.0 && git push origin v0.6.0
# Or Actions → Release → Run workflow with tag input.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.6.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            goos: windows
            goarch: amd64
            ext: .exe
          - os: macos-latest
            goos: darwin
            goarch: arm64
            ext: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version="${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $tag (version $version)"

      - name: Test
        run: go test ./...

      - name: Build
        shell: bash
        env:
          CGO_ENABLED: "1"
        run: |
          v="${{ steps.ver.outputs.version }}"
          ld="-s -w -X main.version=$v"
          out="suzuri${{ matrix.ext }}"
          go build -ldflags "$ld" -o "$out" ./cmd/suzuri
          ls -la "$out"

      - name: Package
        shell: bash
        run: |
          v="${{ steps.ver.outputs.version }}"
          goos="${{ matrix.goos }}"
          goarch="${{ matrix.goarch }}"
          base="suzuri-$v-$goos-$goarch"
          if [ "$goos" = "windows" ]; then
            cp suzuri.exe "$base.exe"
            7z a -tzip "$base.zip" suzuri.exe || powershell -Command "Compress-Archive -Path suzuri.exe -DestinationPath $base.zip -Force"
          else
            cp suzuri "$base"
            chmod +x "$base"
            zip -9 "$base.zip" "$base"
          fi
          ls -la suzuri-*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: suzuri-${{ matrix.goos }}-${{ matrix.goarch }}
          path: suzuri-*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          ls -laR
          find . -type f -name 'suzuri-*' ! -path './SHA256SUMS' -exec mv -n {} . \; 2>/dev/null || true
          rm -f SHA256SUMS
          for f in suzuri-*; do
            [ -f "$f" ] || continue
            sha256sum "$f" | tee -a SHA256SUMS
          done
          cat SHA256SUMS

      - name: Resolve tag
        id: ver
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: suzuri ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/suzuri-*
            dist/SHA256SUMS
