name: Release

# Cut a release: git tag v0.6.0 && git push origin v0.6.0
# Or Actions → Release → Run workflow with tag input.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.6.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            goos: windows
            goarch: amd64
            ext: .exe
          - os: macos-latest
            goos: darwin
            goarch: arm64
            ext: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # P2P transfer engine lives in-repo: libs/transfer (Rust/iroh).
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo (transfer engine)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: libs/transfer -> libs/transfer/target
          shared-key: suzuri-transfer-${{ matrix.goos }}-${{ matrix.goarch }}
          cache-targets: false

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version="${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $tag (version $version)"

      - name: Test
        run: go test ./...

      - name: Test transfer engine
        shell: bash
        run: cargo test --manifest-path libs/transfer/Cargo.toml --workspace

      - name: Build transfer engine
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --manifest-path libs/transfer/Cargo.toml -p hato-cli
          if [ "${{ matrix.goos }}" = "windows" ]; then
            cp libs/transfer/target/release/suzuri-transfer.exe ./suzuri-transfer.exe
          else
            cp libs/transfer/target/release/suzuri-transfer ./suzuri-transfer
            chmod +x ./suzuri-transfer
          fi
          ls -la ./suzuri-transfer*

      - name: Build
        shell: bash
        env:
          CGO_ENABLED: "1"
        run: |
          v="${{ steps.ver.outputs.version }}"
          # Windows: -H windowsgui so double-click launches the host without a
          # spare console. CLI (`version`) reattaches via winconsole; `mcp` keeps
          # inherited pipes. macOS: plain executable (no PE subsystem flag).
          ld="-s -w -X main.version=$v"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            ld="-H windowsgui $ld"
          fi
          out="suzuri${{ matrix.ext }}"
          go build -ldflags "$ld" -o "$out" ./cmd/suzuri
          ls -la "$out"

      - name: Package
        shell: bash
        run: |
          v="${{ steps.ver.outputs.version }}"
          goos="${{ matrix.goos }}"
          goarch="${{ matrix.goarch }}"
          base="suzuri-$v-$goos-$goarch"
          if [ "$goos" = "windows" ]; then
            # Portable zip is the in-app update payload (host + transfer engine).
            7z a -tzip "$base.zip" suzuri.exe suzuri-transfer.exe \
              || powershell -Command "Compress-Archive -Path suzuri.exe,suzuri-transfer.exe -DestinationPath $base.zip -Force"
            # Standalone host exe kept for convenience (no transfer engine).
            cp suzuri.exe "$base.exe"
          else
            # Bare host binary (legacy); zip is preferred update payload.
            cp suzuri "$base"
            chmod +x "$base" suzuri-transfer
            zip -9 "$base.zip" suzuri suzuri-transfer
          fi
          ls -la suzuri-*

      # User-scoped NSIS installer: Start Menu, desktop shortcut, Add/Remove
      # Programs. Installs under %LOCALAPPDATA%\Programs\suzuri (no admin) so
      # the existing in-app updater can still replace the exe in place.
      - name: Windows installer (NSIS)
        if: matrix.goos == 'windows'
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          choco install nsis -y --no-progress
          $makensis = @(
            "${env:ProgramFiles(x86)}\NSIS\makensis.exe",
            "$env:ProgramFiles\NSIS\makensis.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $makensis) { throw "makensis.exe not found after choco install nsis" }
          # NSIS File/icon paths are relative to the .nsi script dir — use absolute.
          $root = (Get-Location).Path
          $out = Join-Path $root "suzuri-$v-windows-amd64-setup.exe"
          $exe = Join-Path $root "suzuri.exe"
          $xfer = Join-Path $root "suzuri-transfer.exe"
          $ico = Join-Path $root "assets\icon\suzuri.ico"
          if (-not (Test-Path $exe)) { throw "missing $exe" }
          if (-not (Test-Path $xfer)) { throw "missing $xfer" }
          if (-not (Test-Path $ico)) { throw "missing $ico" }
          & $makensis `
            "/DVERSION=$v" `
            "/DOUTFILE=$out" `
            "/DSOURCE_EXE=$exe" `
            "/DSOURCE_TRANSFER=$xfer" `
            "/DICON=$ico" `
            (Join-Path $root "packaging\windows\suzuri.nsi")
          if ($LASTEXITCODE -ne 0) { throw "makensis failed: $LASTEXITCODE" }
          Get-Item $out | Format-List Name, Length, FullName

      # Import Developer ID cert when secrets are configured (optional).
      # Without secrets, build-app.sh falls back to ad-hoc signing.
      - name: Import Apple signing certificate
        # Skip when secret unset (ad-hoc local-style macOS artifacts).
        if: matrix.goos == 'darwin' && secrets.MACOS_CERTIFICATE_P12_BASE64 != ''
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          CERT="$RUNNER_TEMP/suzuri-dev-id.p12"
          echo "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode >"$CERT"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import "$CERT" -k build.keychain -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security list-keychains -d user -s build.keychain $(security list-keychains -d user | tr -d '"')
          echo "==> codesigning identities:"
          security find-identity -v -p codesigning
          rm -f "$CERT"

      # macOS: .app bundle with dock icon + DMG (drag to Applications).
      # Portable zip (host + transfer) is the in-app update payload.
      # When Developer ID secrets are present: sign + notarize (.app and .dmg).
      - name: macOS app + DMG
        if: matrix.goos == 'darwin'
        env:
          SUZURI_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          v="${{ steps.ver.outputs.version }}"
          arch="${{ matrix.goarch }}"
          # Default ad-hoc when identity secret is empty.
          export SUZURI_CODESIGN_IDENTITY="${SUZURI_CODESIGN_IDENTITY:--}"
          # Skip notarize when no credentials (local-style CI without secrets).
          if [[ -z "${APPLE_ID:-}" && -z "${APPLE_API_KEY_ID:-}" ]]; then
            export SUZURI_NOTARIZE=0
          fi
          mkdir -p dist-mac
          packaging/macos/build-app.sh \
            --binary ./suzuri \
            --transfer ./suzuri-transfer \
            --version "$v" \
            --arch "$arch" \
            --out dist-mac
          # Flatten release artifacts into the job workspace root for upload.
          cp -f dist-mac/suzuri-*-darwin-*.app.zip . 2>/dev/null || true
          cp -f dist-mac/suzuri-*-darwin-*.dmg . 2>/dev/null || true
          ls -la suzuri-*-darwin-* || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: suzuri-${{ matrix.goos }}-${{ matrix.goarch }}
          path: suzuri-*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          ls -laR
          find . -type f -name 'suzuri-*' ! -path './SHA256SUMS' -exec mv -n {} . \; 2>/dev/null || true
          rm -f SHA256SUMS
          for f in suzuri-*; do
            [ -f "$f" ] || continue
            sha256sum "$f" | tee -a SHA256SUMS
          done
          cat SHA256SUMS

      - name: Resolve tag
        id: ver
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: suzuri ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/suzuri-*
            dist/SHA256SUMS
