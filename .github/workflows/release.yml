name: Release

# Cut an app release: git tag v0.6.0 && git push origin v0.6.0
# Site deploys use a different line: v0.1.0-site / site-v0.1.0 (pages.yml only).
# Or Actions → Release → Run workflow with tag input.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.6.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    # GitHub's v*.*.* glob also matches v1.2.3-site — skip those (site line).
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.ref_type == 'tag' &&
       !endsWith(github.ref_name, '-site') &&
       !startsWith(github.ref_name, 'site-'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            goos: windows
            goarch: amd64
            ext: .exe
            # Hosted-runner flakes ("job was not acquired…") and real Windows
            # build breaks must not block shipping a macOS release. Windows
            # assets are best-effort; re-run or re-tag to fill them in later.
            optional: true
          - os: macos-latest
            goos: darwin
            goarch: arm64
            ext: ""
            optional: false
    runs-on: ${{ matrix.os }}
    # continue-on-error only for the optional matrix leg so needs.build can
    # still be success when Windows never gets a runner.
    continue-on-error: ${{ matrix.optional }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # P2P transfer engine + native GPU chrome live in-repo (Rust).
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo (transfer engine)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: libs/transfer -> libs/transfer/target
          shared-key: suzuri-transfer-${{ matrix.goos }}-${{ matrix.goarch }}
          cache-targets: false

      - name: Cache cargo (native chrome)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: chrome -> chrome/target
          shared-key: suzuri-chrome-${{ matrix.goos }}-${{ matrix.goarch }}
          cache-targets: false

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version="${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $tag (version $version)"

      - name: Test
        run: go test ./...

      - name: Test transfer engine
        shell: bash
        run: cargo test --manifest-path libs/transfer/Cargo.toml --workspace

      - name: Test native chrome
        shell: bash
        run: cargo test --manifest-path chrome/Cargo.toml --bins

      - name: Build transfer engine
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --manifest-path libs/transfer/Cargo.toml -p hato-cli -p suzuri-workspace-sync
          if [ "${{ matrix.goos }}" = "windows" ]; then
            cp libs/transfer/target/release/suzuri-transfer.exe ./suzuri-transfer.exe
            cp libs/transfer/target/release/suzuri-workspace-sync.exe ./suzuri-workspace-sync.exe
          else
            cp libs/transfer/target/release/suzuri-transfer ./suzuri-transfer
            cp libs/transfer/target/release/suzuri-workspace-sync ./suzuri-workspace-sync
            chmod +x ./suzuri-transfer ./suzuri-workspace-sync
          fi
          ls -la ./suzuri-transfer* ./suzuri-workspace-sync*

      - name: Build native chrome
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --manifest-path chrome/Cargo.toml --bin suzuri-chrome
          if [ "${{ matrix.goos }}" = "windows" ]; then
            cp chrome/target/release/suzuri-chrome.exe ./suzuri-chrome.exe
          else
            cp chrome/target/release/suzuri-chrome ./suzuri-chrome
            chmod +x ./suzuri-chrome
          fi
          ls -la ./suzuri-chrome*

      - name: Build
        shell: bash
        env:
          CGO_ENABLED: "1"
        run: |
          v="${{ steps.ver.outputs.version }}"
          # Windows: -H windowsgui so double-click launches the host without a
          # spare console. CLI (`version`) reattaches via winconsole; `mcp` keeps
          # inherited pipes. macOS: plain executable (no PE subsystem flag).
          ld="-s -w -X main.version=$v"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            ld="-H windowsgui $ld"
          fi
          out="suzuri${{ matrix.ext }}"
          go build -ldflags "$ld" -o "$out" ./cmd/suzuri
          ls -la "$out"

      - name: Package
        shell: bash
        run: |
          v="${{ steps.ver.outputs.version }}"
          goos="${{ matrix.goos }}"
          goarch="${{ matrix.goarch }}"
          base="suzuri-$v-$goos-$goarch"
          if [ "$goos" = "windows" ]; then
            # Portable zip: host + transfer + chrome (sibling layout for ResolveBinary).
            7z a -tzip "$base.zip" suzuri.exe suzuri-transfer.exe suzuri-chrome.exe suzuri-workspace-sync.exe \
              || powershell -Command "Compress-Archive -Path suzuri.exe,suzuri-transfer.exe,suzuri-chrome.exe,suzuri-workspace-sync.exe -DestinationPath $base.zip -Force"
            # Standalone host exe kept for convenience (no sidecars).
            cp suzuri.exe "$base.exe"
          else
            # Bare host binary (legacy); zip is preferred update payload.
            cp suzuri "$base"
            chmod +x "$base" suzuri-transfer suzuri-chrome suzuri-workspace-sync
            zip -9 "$base.zip" suzuri suzuri-transfer suzuri-chrome suzuri-workspace-sync
          fi
          ls -la suzuri-*

      # User-scoped NSIS installer: Start Menu, desktop shortcut, Add/Remove
      # Programs. Installs under %LOCALAPPDATA%\Programs\suzuri (no admin) so
      # the existing in-app updater can still replace the exe in place.
      - name: Windows installer (NSIS)
        if: matrix.goos == 'windows'
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          choco install nsis -y --no-progress
          $makensis = @(
            "${env:ProgramFiles(x86)}\NSIS\makensis.exe",
            "$env:ProgramFiles\NSIS\makensis.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $makensis) { throw "makensis.exe not found after choco install nsis" }
          # NSIS File/icon paths are relative to the .nsi script dir — use absolute.
          $root = (Get-Location).Path
          $out = Join-Path $root "suzuri-$v-windows-amd64-setup.exe"
          $exe = Join-Path $root "suzuri.exe"
          $xfer = Join-Path $root "suzuri-transfer.exe"
          $chrome = Join-Path $root "suzuri-chrome.exe"
          $wssync = Join-Path $root "suzuri-workspace-sync.exe"
          $ico = Join-Path $root "assets\icon\suzuri.ico"
          if (-not (Test-Path $exe)) { throw "missing $exe" }
          if (-not (Test-Path $xfer)) { throw "missing $xfer" }
          if (-not (Test-Path $chrome)) { throw "missing $chrome" }
          if (-not (Test-Path $wssync)) { throw "missing $wssync" }
          if (-not (Test-Path $ico)) { throw "missing $ico" }
          & $makensis `
            "/DVERSION=$v" `
            "/DOUTFILE=$out" `
            "/DSOURCE_EXE=$exe" `
            "/DSOURCE_TRANSFER=$xfer" `
            "/DSOURCE_CHROME=$chrome" `
            "/DSOURCE_WORKSPACE_SYNC=$wssync" `
            "/DICON=$ico" `
            (Join-Path $root "packaging\windows\suzuri.nsi")
          if ($LASTEXITCODE -ne 0) { throw "makensis failed: $LASTEXITCODE" }
          Get-Item $out | Format-List Name, Length, FullName

      # Microsoft Store MSIX (unsigned — Partner Center / Store re-signs).
      # Uses identity.dev.json in CI so packaging always smoke-tests.
      # For a Store-identity package, put Partner Center values in the
      # MSIX_IDENTITY_JSON repo secret (full identity.json body) — optional.
      - name: Windows MSIX package
        if: matrix.goos == 'windows'
        shell: pwsh
        env:
          MSIX_IDENTITY_JSON: ${{ secrets.MSIX_IDENTITY_JSON }}
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $root = (Get-Location).Path
          $idDir = Join-Path $root "packaging\windows\msix"
          $msixOut = Join-Path $root "dist-msix"
          $exe = Join-Path $root "suzuri.exe"
          $xfer = Join-Path $root "suzuri-transfer.exe"
          $chrome = Join-Path $root "suzuri-chrome.exe"
          $wssync = Join-Path $root "suzuri-workspace-sync.exe"
          if (-not (Test-Path $xfer)) { throw "missing $xfer" }
          if (-not (Test-Path $chrome)) { throw "missing $chrome" }
          $script = Join-Path $root "packaging\windows\build-msix.ps1"
          $common = @{
            Version        = $v
            Exe            = $exe
            Transfer       = $xfer
            Chrome         = $chrome
            WorkspaceSync  = $wssync
            OutDir         = $msixOut
            Arch           = "x64"
          }
          if ($env:MSIX_IDENTITY_JSON) {
            $prod = Join-Path $idDir "identity.json"
            Set-Content -Path $prod -Value $env:MSIX_IDENTITY_JSON -Encoding UTF8
            Write-Host "Using Partner Center identity from secret MSIX_IDENTITY_JSON"
            & $script @common
          } else {
            Write-Host "No MSIX_IDENTITY_JSON secret — building dev-identity MSIX (not for Store upload)"
            & $script @common -IdentityDev
          }
          if ($LASTEXITCODE -ne 0) { throw "build-msix.ps1 failed: $LASTEXITCODE" }
          Get-ChildItem $msixOut -Filter "suzuri-*.msix" | ForEach-Object {
            Copy-Item $_.FullName (Join-Path $root $_.Name) -Force
            Get-Item (Join-Path $root $_.Name) | Format-List Name, Length, FullName
          }

      # Import Developer ID cert when secrets are configured (optional).
      # Without secrets, build-app.sh falls back to ad-hoc signing.
      # Note: do not use `secrets.*` in `if:` — GitHub rejects the workflow file.
      - name: Import Apple signing certificate
        if: matrix.goos == 'darwin'
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${MACOS_CERTIFICATE_P12_BASE64:-}" ]]; then
            echo "==> No MACOS_CERTIFICATE_P12_BASE64; skipping cert import (ad-hoc sign)."
            exit 0
          fi
          CERT="$RUNNER_TEMP/suzuri-dev-id.p12"
          echo "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode >"$CERT"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import "$CERT" -k build.keychain -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security list-keychains -d user -s build.keychain $(security list-keychains -d user | tr -d '"')
          echo "==> codesigning identities:"
          security find-identity -v -p codesigning
          rm -f "$CERT"

      # macOS: .app bundle with dock icon + DMG (drag to Applications).
      # Portable zip (host + transfer) is the in-app update payload.
      # When Developer ID secrets are present: sign + notarize (.app and .dmg).
      - name: macOS app + DMG
        if: matrix.goos == 'darwin'
        env:
          SUZURI_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          v="${{ steps.ver.outputs.version }}"
          arch="${{ matrix.goarch }}"
          # Default ad-hoc when identity secret is empty.
          export SUZURI_CODESIGN_IDENTITY="${SUZURI_CODESIGN_IDENTITY:--}"
          # Skip notarize when no credentials (local-style CI without secrets).
          if [[ -z "${APPLE_ID:-}" && -z "${APPLE_API_KEY_ID:-}" ]]; then
            export SUZURI_NOTARIZE=0
          fi
          mkdir -p dist-mac
          packaging/macos/build-app.sh \
            --binary ./suzuri \
            --transfer ./suzuri-transfer \
            --chrome ./suzuri-chrome \
            --workspace-sync ./suzuri-workspace-sync \
            --version "$v" \
            --arch "$arch" \
            --out dist-mac
          # Flatten release artifacts into the job workspace root for upload.
          cp -f dist-mac/suzuri-*-darwin-*.app.zip . 2>/dev/null || true
          cp -f dist-mac/suzuri-*-darwin-*.dmg . 2>/dev/null || true
          ls -la suzuri-*-darwin-* || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: suzuri-${{ matrix.goos }}-${{ matrix.goarch }}
          path: suzuri-*

  release:
    needs: build
    # Publish whatever matrix legs produced artifacts. Skipped only when the
    # whole build job was skipped (site tags) or cancelled. Windows is
    # continue-on-error, so a runner flake still leaves needs.build=success
    # when macOS succeeded; if macOS itself fails we still try to ship any
    # surviving artifacts (and require at least one file below).
    if: ${{ always() && needs.build.result != 'skipped' && needs.build.result != 'cancelled' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
          # Partial matrix success is expected (e.g. Windows never ran).
          # Empty is handled by the next step.
          pattern: suzuri-*

      - name: Checksums
        working-directory: dist
        run: |
          set -euo pipefail
          ls -laR || true
          find . -type f -name 'suzuri-*' ! -path './SHA256SUMS' -exec mv -n {} . \; 2>/dev/null || true
          shopt -s nullglob
          files=(suzuri-*)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::No suzuri-* release artifacts from any platform build"
            exit 1
          fi
          rm -f SHA256SUMS
          for f in "${files[@]}"; do
            [ -f "$f" ] || continue
            sha256sum "$f" | tee -a SHA256SUMS
          done
          cat SHA256SUMS
          # Surface a soft warning when Windows is missing (optional leg).
          if ! compgen -G 'suzuri-*-windows-*' >/dev/null; then
            echo "::warning::Windows artifacts missing — shipping macOS-only release"
          fi

      - name: Resolve tag
        id: ver
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: suzuri ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          # Allow re-running after a partial failure without clobbering.
          # softprops updates an existing release for the same tag.
          files: |
            dist/suzuri-*
            dist/SHA256SUMS
