[workspace]
resolver = "3"
members = ["crates/term", "app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
alacritty_terminal = "0.26.0"
portable-pty = "0.9.0"
tauri = "2.12.5"
tauri-build = "2.7.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossbeam-channel = "0.5"
parking_lot = "0.12"

[profile.release]
debug = 1
