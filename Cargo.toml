[workspace]
resolver = "3"
members = ["crates/term", "app", "tools/fakeagent"]

[workspace.package]
version = "0.10.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
portable-pty = "0.9.0"
tauri = "2.12.5"
tauri-build = "2.7.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossbeam-channel = "0.5"
parking_lot = "0.12"

[profile.release]
debug = 1

# portable-pty 0.9.0 with ConPTY passthrough mode on Windows (#288): ConPTY
# otherwise repaints the screen from its own copy and paints over inline
# images and command blocks. See vendor/portable-pty/src/win/psuedocon.rs.
[patch.crates-io]
portable-pty = { path = "vendor/portable-pty" }
