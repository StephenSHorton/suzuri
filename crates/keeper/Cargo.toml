[package]
name = "rsz-keeper"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "suzuri's shell keeper: the wire format and a client for attaching to kept shells (no rsz-term, no Zig)"

[dependencies]
serde_json = { workspace = true }
base64 = "0.22"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Windows 10 1803+ has AF_UNIX sockets: the same folder of sockets as Unix.
[target.'cfg(windows)'.dependencies]
uds_windows = "1.2"
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Networking_WinSock", "Win32_Security", "Win32_System_IO", "Win32_System_Threading"] }

[[bin]]
name = "rsz-keeper"
path = "src/bin/rsz-keeper.rs"
