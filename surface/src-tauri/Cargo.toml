[package]
name = "suzuri-surface"
version = "0.1.0"
description = "Experimental Tauri web surface for suzuri (Kussetsu GPU chrome + cell terminal)"
authors = ["Stephen Horton"]
edition = "2021"

[lib]
name = "suzuri_surface_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
