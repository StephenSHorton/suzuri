<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>suzuri notices</title>
<style>
/* Go suzuri's notice cards (notices.go drawCard): 320 x 72, a 4 px accent
   bar on the left, the title over the body, panel surface, soft shadow.
   notice.js sets the colours from the theme; these are Inkstone's, until
   the first cards arrive. */
:root {
  --panel: #1c1c22;
  --primary: #b8a0c8;
  --text: #e8e6e3;
  --soft: #b0aea8;
  color-scheme: dark;
}
@font-face {
  font-family: "Gohu";
  src: url("view/fonts/GohuFontuni14NerdFontMono-Regular.ttf") format("truetype");
}
html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
/* Go draws the cards in the terminal's own pixel font. */
body {
  font: 14px/1.4 "Gohu", ui-monospace, Menlo, Consolas, monospace;
  user-select: none; -webkit-user-select: none; cursor: default;
}
/* Go noticeStackLayout: the oldest card at the bottom whatever the anchor. */
#stack { position: absolute; inset: 16px; display: flex; flex-direction: column-reverse; gap: 8px; }
.card {
  position: relative; flex: none; width: 320px; height: 72px; box-sizing: border-box;
  padding: 12px 14px 0 16px; border-radius: 8px; overflow: hidden;
  background: color-mix(in srgb, var(--panel) 95%, transparent);
  box-shadow: 3px 4px 0 rgba(0, 0, 0, .27);
  animation: in .22s cubic-bezier(.2, .8, .2, 1);
}
.card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--primary); }
.card.error::before { background: rgb(220, 70, 70); }
.card.warn::before { background: rgb(210, 170, 60); }
.card .t { color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .b {
  margin-top: 4px; color: var(--soft); overflow: hidden;
  white-space: nowrap; text-overflow: ellipsis;
}
.card:hover { filter: brightness(1.12); }
/* Go: left anchors enter from the left, right from the right, and every
   anchor nudges toward its edge (centre rises). */
@keyframes in { from { opacity: 0; transform: translate(var(--dx, 0), var(--dy, 12px)); } }
body.left .card { --dx: -36px; --dy: 0; }
body.right .card { --dx: 36px; --dy: 0; }
body.top .card { --dy: -12px; }
</style>
</head>
<body>
<div id="stack"></div>
<script type="module" src="notice.js"></script>
</body>
</html>
